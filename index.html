
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .system-font {
            font-family: 'Orbitron', sans-serif;
        }
        .system-border {
            border: 1px solid rgba(0, 191, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.1);
        }
        .glow-blue {
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.8);
        }
        .glow-purple {
            text-shadow: 0 0 12px rgba(147, 51, 234, 0.8);
        }
        .glow-red {
            text-shadow: 0 0 8px rgba(220, 38, 38, 0.8);
        }
        .system-bg {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            backdrop-filter: blur(8px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #0ea5e9;
            border-radius: 10px;
        }
        
        /* Avatar Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float {
            animation: float 5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-breathe {
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes mana-pulse {
            0% { box-shadow: 0 0 0 0 currentColor; border-width: 2px; }
            70% { box-shadow: 0 0 0 30px transparent; border-width: 1px; }
            100% { box-shadow: 0 0 0 0 transparent; border-width: 2px; }
        }

        @keyframes shadow-drift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.3; }
            33% { transform: translate(10px, -10px) scale(1.1) rotate(2deg); opacity: 0.5; }
            66% { transform: translate(-10px, 10px) scale(0.9) rotate(-2deg); opacity: 0.2; }
            100% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.3; }
        }
        .animate-shadow-drift {
            animation: shadow-drift 6s infinite ease-in-out;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(14, 165, 233, 0.05) 50%, transparent 100%);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fadeInUp {
            animation: fadeInUp 0.3s ease-out forwards;
        }

        @keyframes gate-glitch {
            0% { text-shadow: 2px 0 0 #ff00ff, -2px 0 0 #00ffff; border-color: rgba(14, 165, 233, 0.5); }
            25% { text-shadow: -2px 0 0 #ff00ff, 2px 0 0 #00ffff; border-color: rgba(168, 85, 247, 0.5); }
            50% { text-shadow: 2px 0 0 #ff00ff, -2px 0 0 #00ffff; border-color: rgba(14, 165, 233, 0.8); }
            75% { text-shadow: -2px 0 0 #ff00ff, 2px 0 0 #00ffff; border-color: rgba(168, 85, 247, 0.8); }
            100% { text-shadow: 2px 0 0 #ff00ff, -2px 0 0 #00ffff; border-color: rgba(14, 165, 233, 0.5); }
        }

        .gate-button-effect {
            animation: gate-glitch 2s infinite linear;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2), inset 0 0 10px rgba(168, 85, 247, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Quest Specific Animations */
        @keyframes quest-complete-glow {
            0% { box-shadow: 0 0 0px rgba(34, 197, 94, 0); }
            50% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); }
            100% { box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        }
        .quest-completed-card {
            border-color: rgba(34, 197, 94, 0.5) !important;
            background: linear-gradient(to right, rgba(34, 197, 94, 0.05), transparent) !important;
            animation: quest-complete-glow 2s infinite ease-in-out;
        }

        @keyframes progress-spark {
            0% { left: -10%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 110%; opacity: 0; }
        }
        .progress-spark-effect {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform: skewX(-20deg);
            animation: progress-spark 2s infinite linear;
        }

        /* Status: Burning (Flicker & Rise) */
        @keyframes flame-flicker {
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.8; }
            50% { transform: scale(1.1) translateY(-5px); opacity: 1; }
        }
        .status-burning {
            background: radial-gradient(ellipse at bottom, #f97316 0%, transparent 70%);
            filter: blur(8px);
            animation: flame-flicker 0.3s infinite alternate;
        }

        /* Status: Poison (Rising Bubbles) */
        @keyframes poison-rise {
            0% { transform: translateY(20px) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) scale(2); opacity: 0; }
        }
        .poison-particle {
            position: absolute;
            background: #22c55e;
            border-radius: 50%;
            filter: blur(2px);
            animation: poison-rise 2s infinite linear;
        }

        /* Status: Stunned (Orbiting Stars) */
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(40px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
        }
        .stun-star {
            position: absolute;
            color: #facc15;
            animation: orbit 1.5s infinite linear;
        }

        /* Shatter Animation */
        @keyframes shatter {
            0% { transform: scale(1) rotate(0); opacity: 1; filter: brightness(1) blur(0); }
            50% { transform: scale(1.1) rotate(2deg); opacity: 0.8; filter: brightness(2) blur(2px); }
            100% { transform: scale(1.4) rotate(-5deg); opacity: 0; filter: brightness(4) blur(15px); }
        }
        .animate-shatter {
            animation: shatter 0.6s ease-out forwards;
            pointer-events: none;
        }

        /* Selection pulse */
        @keyframes pulse-selected {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(14, 165, 233, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(14, 165, 233, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(14, 165, 233, 0.4); }
        }
        .item-selected {
            border-color: #0ea5e9 !important;
            border-width: 2px !important;
            animation: pulse-selected 2s infinite ease-in-out;
            z-index: 20;
            background: rgba(14, 165, 233, 0.1) !important;
        }

        /* Inventory Wave Ripple */
        @keyframes selection-ripple {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0.8; border-width: 4px; }
            100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; border-width: 1px; }
        }
        .mana-ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 2px solid #0ea5e9;
            border-radius: 50%;
            pointer-events: none;
            width: 100px;
            height: 100px;
            animation: selection-ripple 2s infinite cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Coin Explosion */
        @keyframes coin-fly {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0) rotate(var(--tw-rotate)); opacity: 0; }
        }
        .animate-coin {
            animation: coin-fly 1.2s ease-out forwards;
        }

        /* Loot Glow */
        @keyframes loot-glow {
            0% { box-shadow: 0 0 0px 0px rgba(255, 215, 0, 0); transform: scale(0.9); opacity: 0; }
            20% { opacity: 1; }
            100% { box-shadow: 0 0 100px 20px rgba(255, 215, 0, 0); transform: scale(1); opacity: 1; }
        }
        .loot-reveal {
            animation: loot-glow 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Attribute Update Pulse */
        @keyframes attr-pulse {
            0% { background-color: rgba(14, 165, 233, 0.3); transform: scale(1.05); }
            100% { background-color: transparent; transform: scale(1); }
        }
        .animate-attr-update {
            animation: attr-pulse 0.5s ease-out;
        }

        /* Chart Magic Grid */
        .chart-glow-filter {
            filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.5));
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
